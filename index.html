      ["friends","Friends","Monica & Rachel","https://media1.tenor.com/m/iEO777xifaUAAAAd/friends-monica.gif"],["one-piece","One Piece","Zoro","https://media1.tenor.com/m/6hpHOoi5ezkAAAAd/one-piece-zoro.gif"],["demon-slayer","Demon Slayer","Nezuko","https://media1.tenor.com/m/Rnc-Be3vfxYAAAAd/demon-slayer-nezuko.gif"],["ghost-stories","Ghost Stories","Keiichiro","https://media1.tenor.com/m/rHf9HuZyIYcAAAAd/keichiro-ghost-stories.gif"],["marvel","Marvel","Hulk","https://media1.tenor.com/m/eI56KLyo-mAAAAAd/avengers-hulk.gif"],["stray-kids","Stray Kids","Stray Kids","https://media1.tenor.com/m/fpCx57JtiQAAAAAd/stray-kids.gif"]
    ];
    const fanGifs=[["Zoro","https://media1.tenor.com/m/6hpHOoi5ezkAAAAd/one-piece-zoro.gif"],["Stray Kids","https://media1.tenor.com/m/fpCx57JtiQAAAAAd/stray-kids.gif"],["Eren","https://media1.tenor.com/m/J4JmyQx91dYAAAAd/eren-eren-yeager.gif"],["Mark","https://media1.tenor.com/m/uw_bqeDdsv8AAAAd/mark-ruffalo-smiling.gif"],["Zenitsu","https://media1.tenor.com/m/-DmvUlNxxpUAAAAd/zenitsu-zenitsu-agatsuma.gif"],["Hulk mood","https://media1.tenor.com/m/OJIque1yFvIAAAAd/mark-ruffalo-the-avengers.gif"]];
    const tracks=[['moonlit','Moonlit bloom','warm keys + sleepy bass',[[220,277.18,329.63],[174.61,220,261.63],[196,246.94,293.66],[164.81,207.65,246.94]],[659.25,587.33,493.88,523.25],3600],['mint','Mint after rain','soft rain-room loop',[[196,246.94,293.66],[146.83,196,246.94],[174.61,220,261.63],[164.81,207.65,246.94]],[587.33,659.25,698.46,587.33],3900],['pink','Pink lanterns','late-night slow dance',[[246.94,293.66,369.99],[196,246.94,293.66],[220,261.63,329.63],[174.61,220,277.18]],[739.99,659.25,587.33,523.25],3800]];
    const $=s=>document.querySelector(s), shuffle=a=>{let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
    let scene=null,caught=[],wish="catch a petal. it has something cute to say.",cardId=categories[0][0],deck=[],flipped=[],matched=[],mistakes=0,turns=0,cardDone=new Set(),cardNote="choose a category, then find all 30 pairs.",wordId=searches[0][0],wordStart=null,found=[],wordDone=new Set(),wordNote="every hidden word reads left to right — tap its first and last letter.",gifOrder=shuffle(gifItems.map(x=>x[0])),gifSelected=null,gifMatched=[],gifNote="tap a name, then tap the GIF that belongs with it.";
    function fireworks(){return `<div class="fireworks">${Array.from({length:13},(_,i)=>`<i class="firework f${i%5}" style="left:${8+(i*31)%84}%;top:${8+(i*19)%65}%;animation-delay:${i*.14}s"></i>`).join('')}</div>`}
    function finish(title,copy){return `<div class="finish">${fireworks()}<i>⚜</i><div><p>your surprise gift</p><h3>${title}</h3><span>${copy}</span></div></div>`}
    function openScene(next){scene=next;renderScene()} function closeScene(){scene=null;$('#overlay').hidden=true}
    function renderScene(){let o=$('#overlay');o.hidden=false;let html=`<button class="close" onclick="closeScene()">close ×</button>`;if(scene==='letter')html+=`<section class="room letter-room"><p class="kicker">for you, always</p><h2>raedah,</h2><p>you’re my cousin on paper, but that has never been the real story. you’re my sister in the way we grew up together, in the way i’d pick you in every room, in the way some of my favorite memories only make sense because you’re in them.</p><p>i hope you know that you do not have to be extra anything to be loved big. you are already funny, warm, easy to miss, impossible to replace, and entirely your own kind of special.</p><p class="sign">love you forever, your cousin-sister ♡</p></section>`;if(scene==='midnight')html+=`<section class="room letter-room"><p class="kicker">opened after the world gets quiet</p><h2>if it’s late, read this slower.</h2><p>you’re allowed to put the whole day down for a second. you don’t have to solve tomorrow tonight. you can just breathe, put on a soft song, drink some water, and remember that you are doing better than your brain is letting you believe.</p><p class="sign">ps. zoro would still get lost finding this note. ♡</p></section>`;if(scene==='petals')html+=renderPetals();if(scene==='cards')html+=renderCards();if(scene==='words')html+=renderWords();if(scene==='gifs')html+=renderGifs();if(scene==='favorites')html+=renderFavorites();o.innerHTML=html}
    function renderPetals(){let pos=[[14,12],[42,23],[23,42],[58,56],[14,74],[36,84],[70,14],[71,35],[49,70],[75,84],[9,59],[28,30],[7,26],[60,7],[36,51],[19,87],[76,64],[57,91],[49,39],[27,65]];return `<section class="room petal-room"><div class="intro"><p class="kicker">tiny game, zero pressure</p><h2>catch the petals before they disappear.</h2><p>you found <b>${caught.length}</b> out of 20. every one has a secret little wish in it.</p></div><div class="petal-field">${caught.map((_,i)=>'').join('')}${Array.from({length:20},(_,i)=>`<button class="petal ${caught.includes(i)?'found':''}" onclick="catchPetal(${i})" style="top:${pos[i][0]}%;left:${pos[i][1]}%;animation-delay:-${(i%6)*.45}s">${caught.includes(i)?'✦':'✿'}</button>`).join('')}${caught.length===20?fireworks():''}</div><div class="wish">${caught.length===20?'you did it — the whole garden is celebrating you. ✦':wish}</div><div class="line">${caught.length===20?'you got every single one. officially blossom royalty.':'tap the little pink petals floating around.'}<button onclick="resetPetals()">start over</button></div></section>`}
    function catchPetal(i){if(!caught.includes(i)){caught.push(i);wish=petalWishes[i%petalWishes.length]}renderScene()}function resetPetals(){caught=[];wish='new round, new little wishes.';renderScene()}
    function startDeck(id=cardId,note='fresh deck! find all 30 pairs.'){cardId=id;let c=categories.find(x=>x[0]===id);deck=shuffle(c[3].flatMap((label,i)=>[{id:`${id}-${i}-a`,key:`${id}-${i}`,label},{id:`${id}-${i}-b`,key:`${id}-${i}`,label}]));flipped=[];matched=[];mistakes=0;turns=0;cardNote=note;renderScene()}
    function renderCards(){if(!deck.length)startDeck(cardId);let c=categories.find(x=>x[0]===cardId);return `<section class="room"><div class="intro"><p class="kicker">six little memory worlds</p><h2>match what she loves.</h2><p>Each category has 30 pairs. Six missed turns resets only the deck you’re currently playing.</p></div><div class="categories">${categories.map(x=>`<button class="category ${x[0]===cardId?'active':''}" onclick="startDeck('${x[0]}')"><i>${x[2]}</i><span>${x[1]}</span><small>${cardDone.has(x[0])?'complete ✦':'30 pairs'}</small></button>`).join('')}</div><div class="status"><span>${c[2]} ${c[1]}</span><b>${matched.length/2}/30 pairs</b><em>${turns} turns</em><em>${mistakes}/6 mistakes</em><button onclick="startDeck()">shuffle again</button></div><p class="note">${cardNote}</p><div class="board">${deck.map(card=>{let open=flipped.includes(card.id)||matched.includes(card.id);return `<button class="card ${open?'open':''} ${matched.includes(card.id)?'matched':''}" onclick="pickCard('${card.id}')" ${matched.includes(card.id)?'disabled':''}><span class="back">${c[2]}</span><span class="face">${card.label}</span></button>`}).join('')}</div><p class="progress">categories completed: ${cardDone.size}/6</p>${cardDone.size===6?finish('you completed every memory world.','A lily for you, a whole firework sky, and proof that you are the main character of this garden.'):''}</section>`}
    function pickCard(id){if(flipped.includes(id)||matched.includes(id)||flipped.length===2)return;flipped.push(id);if(flipped.length<2){cardNote='one card open — find its twin.';renderScene();return}turns++;let a=deck.find(x=>x.id===flipped[0]),b=deck.find(x=>x.id===flipped[1]);if(a.key===b.key){matched.push(...flipped);flipped=[];if(matched.length===deck.length){cardDone.add(cardId);cardNote='all 30 pairs found! this category is safely in your garden. ✦'}else cardNote='a perfect match! keep the glow going.';renderScene();return}mistakes++;if(mistakes===6){cardNote='six misses — this deck is reshuffling, but every other category stays safe.';renderScene();setTimeout(()=>startDeck(cardId,'this category restarted with six fresh chances.'),900);return}cardNote=`not quite — ${6-mistakes} chances left in this category.`;renderScene();setTimeout(()=>{flipped=[];renderScene()},850)}
    function wordSearch(){let c=searches.find(x=>x[0]===wordId),grid=Array.from({length:15},(_,r)=>Array.from({length:15},(_,q)=>String.fromCharCode(65+(r*11+q*7+c[0].length*3)%26))),words=c[3].map((w,r)=>{let s=(r*3+c[0].length)%(16-w.length),path=Array.from({length:w.length},(_,i)=>r*15+s+i);w.split('').forEach((ch,i)=>grid[r][s+i]=ch);return{w,path}});return{c,grid:grid.flat(),words}}
    function startWords(id=wordId){wordId=id;wordStart=null;found=[];wordNote='every hidden word reads left to right — tap its first and last letter.';renderScene()}function renderWords(){let d=wordSearch();return `<section class="room"><div class="intro"><p class="kicker">seven huge word hunts</p><h2>find every favorite.</h2><p>${wordNote}</p></div><div class="categories">${searches.map(x=>`<button class="category ${x[0]===wordId?'active':''}" onclick="startWords('${x[0]}')"><i>${x[2]}</i><span>${x[1]}</span><small>${wordDone.has(x[0])?'complete ✦':'15 × 15'}</small></button>`).join('')}</div><div class="word-layout"><div class="word-grid">${d.grid.map((l,i)=>`<button class="word-cell ${wordStart===i?'start':''} ${d.words.some(x=>found.includes(x.w)&&x.path.includes(i))?'found':''}" onclick="pickWord(${i})">${l}</button>`).join('')}</div><div class="word-list"><span>${d.c[2]} find these:</span>${d.words.map(x=>`<b class="${found.includes(x.w)?'solved':''}">${found.includes(x.w)?'✦':'○'} ${x.w}</b>`).join('')}<button class="restart" onclick="startWords()">restart this hunt</button></div></div><p class="progress">word searches completed: ${wordDone.size}/7</p>${wordDone.size===7?finish('you found every hidden word.','The final surprise is a whole night garden cheering for you — you finished all seven.'):''}</section>`}
    function pickWord(i){let d=wordSearch();if(wordStart===null){wordStart=i;wordNote='now tap the last letter of that same word.';renderScene();return}let a=wordStart,ar=Math.floor(a/15),ac=a%15,br=Math.floor(i/15),bc=i%15,dr=br-ar,dc=bc-ac,steps=Math.max(Math.abs(dr),Math.abs(dc));wordStart=null;let path=!steps||!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc))?[]:Array.from({length:steps+1},(_,n)=>(ar+n*Math.sign(dr))*15+ac+n*Math.sign(dc));let m=d.words.find(x=>x.path.length===path.length&&(x.path.every((z,n)=>z===path[n])||x.path.every((z,n)=>z===path[path.length-1-n])));if(m&&!found.includes(m.w)){found.push(m.w);if(found.length===d.words.length){wordDone.add(wordId);wordNote=`${m.w} found! this whole word search is blooming. ✦`}else wordNote=`${m.w} found! keep going.`}else wordNote=m?`${m.w} is already glowing.`:'not that one — try one that reads clearly left to right.';renderScene()}
    function renderGifs(){return `<section class="room"><div class="intro"><p class="kicker">a little connection game</p><h2>match the name to the GIF.</h2><p>${gifNote}</p></div><div class="gif-board"><svg class="gif-lines" viewBox="0 0 100 600" preserveAspectRatio="none">${gifMatched.map(id=>`<line x1="32" y1="${gifItems.findIndex(x=>x[0]===id)*100+50}" x2="68" y2="${gifOrder.indexOf(id)*100+50}"/>`).join('')}</svg><div class="gif-names">${gifItems.map((x,i)=>`<button class="${gifSelected===x[0]?'selected':''} ${gifMatched.includes(x[0])?'matched':''}" onclick="chooseGifName('${x[0]}')" ${gifMatched.includes(x[0])?'disabled':''}><small>${i+1}. ${x[1]}</small><b>${x[2]}</b></button>`).join('')}</div><div class="gif-cards">${gifOrder.map(id=>{let x=gifItems.find(q=>q[0]===id);return `<button class="${gifMatched.includes(id)?'matched':''}" onclick="chooseGif('${id}')" ${gifMatched.includes(id)?'disabled':''}><img src="${x[3]}" alt="${x[1]} animated GIF"><span>${gifMatched.includes(id)?'connected ✦':'tap this GIF'}</span></button>`}).join('')}</div></div><p class="progress">connections complete: ${gifMatched.length}/6</p>${gifMatched.length===6?finish('every world is connected.','Here is your lily, your firework sky, and one giant reminder that you are loved.'):''}</section>`}function chooseGifName(id){if(!gifMatched.includes(id)){gifSelected=id;gifNote='now tap the matching GIF on the right.';renderScene()}}function chooseGif(id){if(!gifSelected){gifNote='start by choosing a name on the left.';renderScene();return}if(gifSelected===id){gifMatched.push(id);gifSelected=null;gifNote=gifMatched.length===6?'every category connected — your whole little universe is glowing!':'that line is a match! choose another name.'}else{gifSelected=null;gifNote='not that GIF — no worries, try another connection.'}renderScene()}
    function renderFavorites(){return `<section class="room favorites-room"><div><p class="kicker">your little corner of the tree</p><h2>the things that make you smile.</h2><p>lilies forever. mint anything. Zoro and the straw hats. Stray Kids on max volume. Monica, Joey, Chandler. some Avengers. Zenitsu being Zenitsu. Eren staring dramatically. Bruno Mars. Mark Ruffalo. all of it.</p><div class="wall"><p>tap a favorite — this wall is meant to be a little ridiculous.</p><div class="chips"><button>☕ Friends</button><button>🎤 Bruno</button><button>⚡ Zenitsu</button><button>💚 Avengers</button><button>🕺 SKZ</button></div></div></div><div class="gifs">${fanGifs.map((x,i)=>`<div class="sticker s${i+1}"><img src="${x[1]}" alt="${x[0]} animated sticker"><span>${x[0]}</span></div>`).join('')}</div></section>`}
    let audio=null,timer=null,currentTrack=null;function tone(ctx,f,start,dur,level,type){let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(level,start+.16);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g).connect(ctx.destination);o.start(start);o.stop(start+dur+.1)}function playTrack(id){if(currentTrack===id)return;if(timer)clearTimeout(timer);if(audio)audio.close();currentTrack=id;audio=new AudioContext();let t=tracks.find(x=>x[0]===id),step=0;let loop=()=>{if(!audio)return;if(audio.state==='suspended')audio.resume();let now=audio.currentTime,chord=t[3][step%t[3].length];chord.forEach((n,i)=>tone(audio,n,now+i*.02,4.3,.03/(i+1),i?'sine':'triangle'));tone(audio,chord[0]/2,now,3.9,.04,'sine');tone(audio,t[4][step%t[4].length],now+1.08,2.2,.018,'sine');step++;timer=setTimeout(loop,t[5])};loop();renderTracks()}function stopMusic(){if(timer)clearTimeout(timer);timer=null;if(audio)audio.close();audio=null;currentTrack=null;renderTracks()}function renderTracks(){$('#tracks').innerHTML=tracks.map((t,i)=>`<button class="track ${currentTrack===t[0]?'active':''}" onclick="playTrack('${t[0]}')"><em>0${i+1}</em><span><b>${t[1]}</b><small>${t[2]}</small></span><i>${currentTrack===t[0]?'Ⅱ':'▶'}</i></button>`).join('');$('#music-dot').className='dot '+(currentTrack?'live':'');$('#pause').hidden=!currentTrack;$('#radio-copy').textContent=currentTrack?'now looping · '+tracks.find(t=>t[0]===currentTrack)[1]:'pick a track once and let it stay with you.'}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&audio?.state==='suspended')audio.resume()});
    document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>openScene(b.dataset.scene));$('#pause').onclick=stopMusic;renderTracks();
